[package]
name = "recitor"
version = "0.3.0"
edition = "2021"

[dependencies]
slint = "1.9"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = "0.4"
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[build-dependencies]
slint-build = "1.9"
